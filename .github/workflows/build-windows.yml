name: build-windows

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        run: npm i -g pnpm@12.11.2

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web
        run: pnpm build

      - name: Bundle server (esbuild)
        run: node tools/build-server.mjs

      - name: Make SEA blob
        run: node --experimental-sea-config .stage/sea-config.json

      - name: Assemble sidecar + web resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/bin, src-tauri/web | Out-Null
          $node = (Get-Command node).Source
          Copy-Item $node src-tauri/bin/mynotion-server.exe -Force
          Copy-Item .stage/server.blob .stage/server.blob.bak -Force
          # 注入会让微软的 Authenticode 签名失效，先移除；找不到 signtool 也继续（仅影响签名提示）。
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1 -ExpandProperty FullName
          if ($signtool) { & $signtool remove /s src-tauri/bin/mynotion-server.exe } else { Write-Warning "signtool 未找到，跳过移除签名" }
          npx --yes postject@1.0.0-alpha.6 src-tauri/bin/mynotion-server.exe NODE_SEA_BLOB .stage/server.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          Copy-Item -Recurse -Force apps/web/dist/* src-tauri/web/

      - name: Smoke test backend on Windows
        shell: pwsh
        run: |
          $root = $PWD
          $env:WEB_DIST = "$root\src-tauri\web"
          $env:HOST = "127.0.0.1"

          function Test-Backend([string]$label, [string]$file, [string[]]$argv, [int]$port) {
            Write-Host "======== $label ========"
            $out = "$root\.smoke-$port.out"
            $err = "$root\.smoke-$port.err"
            $env:PORT = "$port"
            $env:DATA_DIR = "$root\.smoke-data-$port"
            $args = @{}
            if ($argv.Count -gt 0) { $args['ArgumentList'] = $argv }
            $p = Start-Process -FilePath $file -PassThru -WindowStyle Hidden -RedirectStandardOutput $out -RedirectStandardError $err @args
            $ok = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 800
              if ($p.HasExited) { Write-Host "EXITED code=$($p.ExitCode)"; break }
              try {
                $r = Invoke-WebRequest "http://127.0.0.1:$port/api/health" -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200) { Write-Host "HEALTH: $($r.Content)"; $ok = $true; break }
              } catch {}
            }
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            foreach ($f in @($err, $out)) {
              if ((Test-Path $f) -and ((Get-Item $f).Length -gt 0)) { Write-Host "--- $f ---"; Get-Content $f -TotalCount 40 }
            }
            return $ok
          }

          Write-Host "server.exe size: $((Get-Item 'src-tauri\bin\mynotion-server.exe').Length)"
          $node = (Get-Command node).Source
          $a = Test-Backend "A: node + server.cjs" $node @(".stage\server.cjs") 18891
          $b = Test-Backend "B: SEA exe" "src-tauri\bin\mynotion-server.exe" @() 18892

          if (-not $a) { throw "A 失败：后端 bundle 在 Windows 上跑不起来（与 SEA 无关）" }
          if (-not $b) { throw "B 失败：SEA 注入后的 exe 无法提供服务" }

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm i -g @tauri-apps/cli@^2

      - name: Build desktop app
        working-directory: src-tauri
        run: tauri build

      - name: Collect artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Recurse src-tauri/target/release/bundle | Select-Object FullName, Length
          Copy-Item src-tauri/target/release/mynotion.exe "MyNotion-portable.exe" -ErrorAction SilentlyContinue | Out-Null

      - uses: actions/upload-artifact@v4
        with:
          name: mynotion-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/mynotion.exe
