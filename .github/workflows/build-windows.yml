name: build-windows

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        run: npm i -g pnpm@12.11.2

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web
        run: pnpm build

      - name: Bundle server (esbuild)
        run: node tools/build-server.mjs

      - name: Make SEA blob
        run: node --experimental-sea-config .stage/sea-config.json

      - name: Assemble sidecar + web resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/bin, src-tauri/web | Out-Null
          $node = (Get-Command node).Source
          Copy-Item $node src-tauri/bin/mynotion-server.exe -Force
          Copy-Item .stage/server.blob .stage/server.blob.bak -Force
          # 注入会让微软的 Authenticode 签名失效，先移除；找不到 signtool 也继续（仅影响签名提示）。
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1 -ExpandProperty FullName
          if ($signtool) { & $signtool remove /s src-tauri/bin/mynotion-server.exe } else { Write-Warning "signtool 未找到，跳过移除签名" }
          npx --yes postject@1.0.0-alpha.6 src-tauri/bin/mynotion-server.exe NODE_SEA_BLOB .stage/server.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          Copy-Item -Recurse -Force apps/web/dist/* src-tauri/web/

      - name: Smoke test backend on Windows
        shell: pwsh
        run: node tools/smoke.mjs --exe src-tauri/bin/mynotion-server.exe

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm i -g @tauri-apps/cli@^2

      - name: Build desktop app
        working-directory: src-tauri
        run: tauri build

      - name: Collect artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Recurse src-tauri/target/release/bundle | Select-Object FullName, Length
          Copy-Item src-tauri/target/release/mynotion.exe "MyNotion-portable.exe" -ErrorAction SilentlyContinue | Out-Null

      - name: Make portable zip
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          Remove-Item -Recurse -Force portable -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item src-tauri/target/release/mynotion.exe portable/
          Copy-Item -Recurse src-tauri/bin portable/bin
          Copy-Item -Recurse src-tauri/web portable/web
          Compress-Archive -Path portable/* -DestinationPath "MyNotion_${ver}_portable.zip" -Force
          Get-ChildItem "MyNotion_*_portable.zip" | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: mynotion-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/mynotion.exe
            MyNotion_*_portable.zip

  # 安装包在干净 runner 上静默安装 → 启动 → 验证后端真的起来了。
  install-test:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mynotion-windows
          path: dist

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem -Recurse dist | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Silent install
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Recurse -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "产物里没有 setup.exe" }
          Write-Host "安装：$($setup.FullName) ($([math]::Round($setup.Length/1MB,2)) MB)"
          $proc = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -PassThru -Wait
          Write-Host "安装退出码：$($proc.ExitCode)"
          $app = $null
          foreach ($c in @("$env:LOCALAPPDATA\Programs\MyNotion", "$env:LOCALAPPDATA\MyNotion", "${env:ProgramFiles}\MyNotion")) {
            if (Test-Path (Join-Path $c 'mynotion.exe')) { $app = Join-Path $c 'mynotion.exe'; break }
          }
          if (-not $app) {
            $found = Get-ChildItem $env:LOCALAPPDATA -Recurse -Filter mynotion.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $app = $found.FullName }
          }
          if (-not $app) { throw "安装后找不到 mynotion.exe" }
          Write-Host "APP: $app"
          Get-ChildItem -Recurse (Split-Path $app) | Select-Object FullName, Length | Format-Table -AutoSize
          "APP=$app" | Add-Content -Path $env:GITHUB_ENV

      - name: Launch and verify backend
        shell: pwsh
        run: |
          Remove-Item "$env:APPDATA\MyNotion" -Recurse -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $env:APP -PassThru
          $log = "$env:APPDATA\MyNotion\logs\server.log"
          $port = $null
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Milliseconds 500
            if ($p.HasExited) { throw "应用启动即退出，exit=$($p.ExitCode)" }
            if (Test-Path $log) {
              $m = Select-String -Path $log -Pattern "listening on http://127\.0\.0\.1:(\d+)" | Select-Object -First 1
              if ($m) { $port = $m.Matches[0].Groups[1].Value; break }
            }
          }
          if (-not $port) { Write-Host (Get-Content $log -ErrorAction SilentlyContinue); throw "后端未在 30s 内监听" }
          Write-Host "PORT=$port"
          $h = Invoke-WebRequest "http://127.0.0.1:$port/api/health" -UseBasicParsing
          Write-Host "HEALTH: $($h.Content)"
          $idx = Invoke-WebRequest "http://127.0.0.1:$port/" -UseBasicParsing
          Write-Host "INDEX: $($idx.StatusCode) bytes=$($idx.Content.Length)"
          Get-Process | Where-Object { $_.ProcessName -match 'mynotion' } | Select-Object Id, ProcessName | Format-Table -AutoSize
          Get-Process mynotion -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          Get-Process mynotion-server -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $h.Content.Contains('"ok":true')) { throw "health 异常" }
          if ($idx.StatusCode -ne 200) { throw "首页异常" }

  # 只有构建 + 安装测试都通过，tag 才发布
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, install-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mynotion-windows
          path: dist
      - name: List
        run: find dist -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bundle/nsis/*.exe
            dist/MyNotion_*_portable.zip
          generate_release_notes: true
          body: |
            Windows 桌面版（安装包 + 免安装便携包）。

            - `MyNotion_*_x64-setup.exe`：当前用户安装，不需要管理员权限；
            - `MyNotion_*_portable.zip`：解压后直接双击 `mynotion.exe`，不写注册表；
            - 数据都在 `%APPDATA%\MyNotion`，整个目录拷走即完整迁移；
            - 未签名，首次运行 SmartScreen 提示时点「更多信息 → 仍要运行」。
